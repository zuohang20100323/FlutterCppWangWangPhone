name: Build Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Enable web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get
        working-directory: wangwang_phone

      - name: Analyze
        run: flutter analyze --no-fatal-infos 2>&1 | head -30
        working-directory: wangwang_phone

      - name: Build web
        run: |
          flutter build web --release --verbose 2>&1 | tail -100
        working-directory: wangwang_phone

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: wangwang_phone/build/web
          retention-days: 7
