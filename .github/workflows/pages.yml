name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
      - run: flutter config --enable-web
      - name: Get deps
        working-directory: wangwang_phone
        run: flutter pub get
      - name: Build web
        working-directory: wangwang_phone
        run: flutter build web --release --base-href "/FlutterCppWangWangPhone/" --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wangwang_phone/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
