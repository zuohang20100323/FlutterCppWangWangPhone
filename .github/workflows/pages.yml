name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
      - name: Enable web
        run: flutter config --enable-web
      - name: Get dependencies
        working-directory: wangwang_phone
        run: flutter pub get
      - name: Build web
        working-directory: wangwang_phone
        run: |
          echo "=== Building web ==="
          flutter build web --release --no-web-resources-cdn --base-href "/FlutterCppWangWangPhone/" 2>&1 | tee /tmp/build.log
          echo "exit code: ${PIPESTATUS[0]}"
          ls -lah build/web/ 2>/dev/null || echo "NO build/web"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: wangwang_phone/build/web

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
